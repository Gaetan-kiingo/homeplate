# CI — install → infra → migrate → lint → build-check → test (U0-BOOTSTRAP; SPMP §5.1.3, free
# tier only). Toolchain substrate for NFR-02, NFR-08, NFR-11: every push replays the full suite
# (including the scale, logging and injection lanes as they land) against real services.
# The suite runs entirely against Docker Compose services (PostgreSQL/Redis/MinIO) with mock
# adapters (ADR-007/ADR-011) — no third-party call, no secret required. Real secrets never
# enter CI; the test environment is fully defined by tests/helpers/env.js.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A leaked handle used to make Jest print a green summary and then never exit, which without a
    # timeout would occupy a runner until GitHub's 6-hour cap and report failure with a passing test
    # summary in the log. The suite takes ~96 s locally; 25 minutes is generous for a cold runner and
    # still fails fast and visibly if the hang returns.
    timeout-minutes: 25
    env:
      # Dev-database URL for the migrate step; tests use their own guarded *_test database.
      DATABASE_URL: postgres://homeplate:homeplate@localhost:5432/homeplate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Start infrastructure (PostgreSQL, Redis, MinIO)
        run: docker compose up -d --wait

      - name: Install
        run: npm ci

      - name: Generate dev TLS certificates
        # certs/ is git-ignored (NFR-03 material never committed); ST-01 needs a live TLS listener.
        run: ./scripts/gen-dev-certs.sh

      - name: Migrate
        run: npm run migrate

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Test (Jest + Supertest, seeded test DB, coverage)
        # TEST_STRICT_HANDLES=1 turns globalTeardown's leaked-handle warning into a hard failure, so
        # a suite that forgets to close a pool, a Redis client or a listener reddens the build
        # instead of silently risking the hang above. Verified locally on this tree: the full suite
        # passes under strict mode WITH coverage (71 suites / 1302 tests, exit 0).
        # --forceExit stays banned: it kills the process before reporters and coverage finish,
        # hiding a leak instead of naming it.
        env:
          TEST_STRICT_HANDLES: '1'
        timeout-minutes: 12
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
